<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100vh; overflow:hidden;
    background:transparent;
    font-family: 'Noto Serif SC', 'Georgia', 'Songti SC', serif;
    display:flex; align-items:center; justify-content:center;
    -webkit-app-region:drag;
    user-select:none;
  }
  #lyrics {
    display:flex; flex-direction:column; align-items:center;
    gap:4px; padding:8px 20px;
    border-radius:12px;
    transition: all 0.3s ease;
  }
  #cur {
    font-weight:600; font-size:22px;
    color: #ff9eaf;
    text-shadow: 0 0 10px #ff9eaf44;
  }
  #next {
    font-size:18px; opacity:0.40;
    color: #ff9eaf;
  }
</style>
</head>
<body>
<div id="lyrics">
  <span id="cur">♫ 等待播放...</span>
  <span id="next"></span>
</div>
<script>
const { ipcRenderer } = require('electron');

ipcRenderer.on('lyric-data', (_e, data) => {
  document.getElementById('cur').textContent = data.text || '♪';
  document.getElementById('next').textContent = data.next || '';
});

ipcRenderer.on('lyric-config', (_e, cfg) => {
  const box = document.getElementById('lyrics');
  if (cfg.bgDark !== undefined) box.style.background = `rgba(0,0,0,${cfg.bgDark})`;
  if (cfg.color) {
    document.getElementById('cur').style.color = cfg.color;
    document.getElementById('next').style.color = cfg.color;
    document.getElementById('cur').style.textShadow = `0 0 10px ${cfg.color}44`;
  }
  if (cfg.fontSize) {
    document.getElementById('cur').style.fontSize = cfg.fontSize + 'px';
    document.getElementById('next').style.fontSize = Math.round(cfg.fontSize * 0.8) + 'px';
  }
  if (cfg.fontFamily) document.body.style.fontFamily = cfg.fontFamily;
});
</script>
</body>
</html>
